name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - claude/busy-fermi-h8to5p
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Install Supabase CLI (official action) ─────────────────────────────
      # Pineamos la versión en vez de "latest" para no pegar contra el rate
      # limit de la GitHub API (60 req/hr anónimo).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Verify CLI version
        run: supabase --version

      # ── Validar que estén los secretos requeridos ─────────────────────────
      # Se configuran en GitHub → Settings → Secrets and variables → Actions:
      #   SUPABASE_ACCESS_TOKEN  → Supabase Dashboard → Account → Access Tokens
      #   SUPABASE_PROJECT_REF   → wqleypebmfiaygrurnrc
      - name: Check secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ Falta el secreto SUPABASE_ACCESS_TOKEN (GitHub → Settings → Secrets → Actions)."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "❌ Falta el secreto SUPABASE_PROJECT_REF (= wqleypebmfiaygrurnrc)."
            exit 1
          fi
          echo "✅ Proyecto Lincoin: ${SUPABASE_PROJECT_REF:0:4}****"

      # ── Desplegar las edge functions a Lincoin ────────────────────────────
      # verify_jwt=false está configurado en supabase/config.toml; cada función
      # hace su propia autenticación. El deploy NO necesita los secrets de
      # runtime (GASFREE_*, MOUV_*, etc.) — esos se leen en ejecución.
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          FAILED=0
          FUNCTIONS="gasfree mouv-proxy finity-proxy finity-webhook didit-kyc admin-data get-system-config notify-transaction user-login admin-login delete-self fastforex-sync fx-snapshot notify-account-events notify-limit-increase send-compliance-email didit-aml-monitor crisp-proxy"
          for fn in $FUNCTIONS; do
            echo "▶ Desplegando $fn…"
            if supabase functions deploy "$fn" \
                --project-ref "$SUPABASE_PROJECT_REF" \
                --no-verify-jwt 2>&1; then
              echo "✅ $fn desplegada"
            else
              echo "❌ $fn FALLÓ"
              FAILED=1
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo "Una o más funciones fallaron. Revisa el log de arriba."
            exit 1
          fi
          echo "🎉 Todas las edge functions desplegadas a Lincoin."
