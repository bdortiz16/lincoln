name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Install Supabase CLI (official action) ─────────────────────────────
      # Pineamos la versión en vez de usar "latest" — "latest" resuelve vía
      # GitHub API y a veces pega contra rate limit (60 req/hr anónimo).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Verify CLI version
        run: supabase --version

      # ── Validate required secrets are present ─────────────────────────────
      - name: Check secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ ERROR: SUPABASE_ACCESS_TOKEN secret is not set."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "❌ ERROR: SUPABASE_PROJECT_REF secret is not set."
            exit 1
          fi
          echo "✅ Empresas project ref: ${SUPABASE_PROJECT_REF:0:4}****"

      # ── Deploy edge functions to EMPRESAS project ──────────────────────────
      # verify_jwt=false is configured in supabase/config.toml for all functions.
      #
      # ⚠️  didit-kyc NO está en la lista — Antigravity es dueño de esa función
      # y la deploya manualmente pegando el código en Supabase Dashboard →
      # Edge Functions → didit-kyc → Code. Si la agregamos acá, cada push a
      # main sobreescribiría su versión canónica (que hace OAuth con Didit,
      # v2/v3 fetch, mapping, webhook fallback) con la versión obsoleta del
      # repo. Hasta que Antigravity haga PR con su código canónico al repo
      # mantenemos didit-kyc fuera del CI.
      - name: Deploy edge functions to Empresas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          FAILED=0
          for fn in notify-transaction admin-data admin-login user-login get-system-config delete-self gasfree mouv-proxy; do
            echo "▶ Deploying $fn → Empresas..."
            if supabase functions deploy "$fn" \
                --project-ref "$SUPABASE_PROJECT_REF" \
                --no-verify-jwt 2>&1; then
              echo "✅ $fn deployed to Empresas"
            else
              echo "❌ $fn FAILED on Empresas"
              FAILED=1
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo "One or more functions failed to deploy to Empresas."
            exit 1
          fi
          echo "🎉 Empresas: all functions deployed (didit-kyc skipped, owned by Antigravity)"
