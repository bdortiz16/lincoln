    <!-- Tailwind ahora se COMPILA en el build de Vite (tailwind.config.js

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #070808;
        color: #F4F4F2;
      }
      /* Blindaje de contraste: si el CDN de Tailwind no genera las clases
         de color (pasa en redes corporativas filtradas), los botones de
         marca quedan igual legibles. El selector por atributo le gana a
         las utilities y no toca hijos con clase de color propia. */
      button[class*="bg-[#0C0E0D]"] { color: #ffffff; }
      button[class*="bg-[#4ADE80]"] { color: #0C0E0D; }

      /* Custom scrollbar for sidebar */
      .sidebar-scroll::-webkit-scrollbar { width: 6px; }
      .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
      .sidebar-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }

      /* ── Scroll reveal ── */
      .reveal {
        opacity: 0;
        transform: translateY(32px);
        transition: opacity 0.65s cubic-bezier(.22,1,.36,1), transform 0.65s cubic-bezier(.22,1,.36,1);
      }
      .reveal.visible { opacity: 1; transform: translateY(0); }
      .reveal-left  { opacity: 0; transform: translateX(-40px); transition: opacity 0.65s cubic-bezier(.22,1,.36,1), transform 0.65s cubic-bezier(.22,1,.36,1); }
      .reveal-left.visible  { opacity: 1; transform: translateX(0); }
      .reveal-right { opacity: 0; transform: translateX(40px);  transition: opacity 0.65s cubic-bezier(.22,1,.36,1), transform 0.65s cubic-bezier(.22,1,.36,1); }
      .reveal-right.visible { opacity: 1; transform: translateX(0); }
      .reveal-scale { opacity: 0; transform: scale(0.92); transition: opacity 0.6s cubic-bezier(.22,1,.36,1), transform 0.6s cubic-bezier(.22,1,.36,1); }
      .reveal-scale.visible { opacity: 1; transform: scale(1); }

      /* Stagger delay helpers */
      .delay-100 { transition-delay: 0.10s !important; }
      .delay-200 { transition-delay: 0.20s !important; }
      .delay-300 { transition-delay: 0.30s !important; }
      .delay-400 { transition-delay: 0.40s !important; }
      .delay-500 { transition-delay: 0.50s !important; }
      .delay-600 { transition-delay: 0.60s !important; }

      /* ── Hero entrance ── */
      @keyframes fadeUp   { from { opacity:0; transform:translateY(28px) } to { opacity:1; transform:translateY(0) } }
      @keyframes fadeIn   { from { opacity:0 }                             to { opacity:1 } }
      @keyframes slideInL { from { opacity:0; transform:translateX(-36px)} to { opacity:1; transform:translateX(0) } }
      @keyframes slideInR { from { opacity:0; transform:translateX(36px) } to { opacity:1; transform:translateX(0) } }
      @keyframes scaleIn  { from { opacity:0; transform:scale(0.90) }      to { opacity:1; transform:scale(1) } }
      @keyframes floatY   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
      @keyframes pulse-ring { 0%{transform:scale(1);opacity:.6} 70%{transform:scale(1.4);opacity:0} 100%{transform:scale(1.4);opacity:0} }
      @keyframes gradientX { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
      @keyframes countUp  { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
      /* Shimmer: barrido diagonal del SMART CARD pill al hover. El span hijo es
         más ancho que el contenedor y se desplaza con background-position. */
      @keyframes shimmer  { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
      /* SmartCard pill — gradiente animado del texto. El icono va al lado del
         texto (no flotando arriba) y el pulse lo da animate-ping en Tailwind. */
      .smartcard-pill .smartcard-text { background-size: 200% auto; animation: gradientX 3s ease infinite; }

      /* ── Logo dot bounce — el puntito del logo Lincoin cae desde arriba y rebota ── */
      @keyframes cuypayDotDrop {
        0%   { transform: translateY(-44px); opacity: 0; }
        45%  { transform: translateY(-44px); opacity: 0; }   /* delay para que el cuadrado se vea primero */
        65%  { transform: translateY(14px);  opacity: 1; }   /* overshoot al impactar */
        78%  { transform: translateY(-8px); }                /* primer rebote */
        88%  { transform: translateY(4px); }                 /* segundo rebote chico */
        96%  { transform: translateY(-2px); }                /* casi quieto */
        100% { transform: translateY(0); opacity: 1; }
      }
      @keyframes cuypayDotPulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.18); }
      }
      .lincoin-dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: cuypayDotDrop 1.4s cubic-bezier(.5,1.6,.5,1) both,
                   cuypayDotPulse 2.6s ease-in-out 1.6s infinite;
      }

      .anim-fade-up   { animation: fadeUp   0.7s cubic-bezier(.22,1,.36,1) both; }
      .anim-fade-in   { animation: fadeIn   0.7s ease both; }
      .anim-slide-l   { animation: slideInL 0.7s cubic-bezier(.22,1,.36,1) both; }
      .anim-slide-r   { animation: slideInR 0.7s cubic-bezier(.22,1,.36,1) both; }
      .anim-scale-in  { animation: scaleIn  0.6s cubic-bezier(.22,1,.36,1) both; }
      .anim-float     { animation: floatY 4s ease-in-out infinite; }
      .anim-float-slow{ animation: floatY 6s ease-in-out infinite; }
      .anim-pulse-ring::before {
        content:''; position:absolute; inset:0; border-radius:inherit;
        border:2px solid #4ADE80; animation: pulse-ring 2s ease-out infinite;
      }

      /* Gradient text animation */
      .gradient-text {
        background: linear-gradient(90deg, #4ADE80, #6EE7A0, #4ADE80);
        background-size: 200% auto;
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        animation: gradientX 3s linear infinite;
      }

      /* Card hover lift */
      .hover-lift { transition: transform 0.25s cubic-bezier(.22,1,.36,1), box-shadow 0.25s ease; }
      .hover-lift:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(45,212,191,.18); }

      /* Button shine sweep */
      .btn-shine { position: relative; overflow: hidden; }
      .btn-shine::after {
        content:''; position:absolute; top:0; left:-100%; width:60%; height:100%;
        background: linear-gradient(120deg,transparent,rgba(255,255,255,.25),transparent);
        transition: left 0.5s ease;
      }
      .btn-shine:hover::after { left:140%; }

      /* Number counter glow */
      .stat-glow { text-shadow: 0 0 20px rgba(45,212,191,.4); }
    </style>
