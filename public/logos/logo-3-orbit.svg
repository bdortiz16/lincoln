<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <style>
      .orbit { animation: orbit 3s linear infinite; transform-origin: 30px 30px; }
      .orbit2 { animation: orbit 3s linear infinite reverse; transform-origin: 30px 30px; animation-delay: -1.5s; }
      .core { animation: glow 2s ease-in-out infinite; }
      @keyframes orbit {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes glow {
        0%,100% { r: 7; opacity: 1; }
        50%      { r: 9; opacity: 0.8; }
      }
    </style>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#0072CE"/>
    </linearGradient>
  </defs>

  <!-- Orbit rings -->
  <ellipse cx="30" cy="30" rx="22" ry="9" stroke="#00C9A7" stroke-width="1.5" fill="none" opacity="0.3" transform="rotate(-30,30,30)"/>
  <ellipse cx="30" cy="30" rx="22" ry="9" stroke="#0072CE" stroke-width="1.5" fill="none" opacity="0.3" transform="rotate(30,30,30)"/>

  <!-- Orbiting dots -->
  <g class="orbit">
    <circle cx="52" cy="30" r="3.5" fill="#00C9A7"/>
  </g>
  <g class="orbit2">
    <circle cx="52" cy="30" r="3" fill="#0072CE"/>
  </g>

  <!-- Core -->
  <circle class="core" cx="30" cy="30" r="7" fill="url(#og)"/>
  <text x="26.5" y="34" font-family="Arial,sans-serif" font-weight="900" font-size="9" fill="white">₿</text>

  <!-- Text -->
  <text x="62" y="36" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="22" fill="#0B1B32" letter-spacing="-0.5">CUY</text>
  <text x="108" y="36" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="22" fill="#00C9A7" letter-spacing="-0.5">PAY</text>
</svg>
