<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Fondo Lincoin (degradado oscuro) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121413"/>
      <stop offset="0.6" stop-color="#0C0E0D"/>
      <stop offset="1" stop-color="#0A0B0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Wordmark: Lincoin + punto verde (Archivo 800) -->
  <text x="600" y="315" text-anchor="middle" font-family="Archivo, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="800" font-size="132" letter-spacing="-4" fill="#F4F4F2">Lincoin<tspan fill="#4ADE80">.</tspan></text>

  <!-- Subtítulo neutro y verdadero (Colombia) -->
  <text x="600" y="400" text-anchor="middle" font-family="Archivo, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="500" font-size="34" letter-spacing="0.5" fill="#878E88">Tu cuenta digital · Colombia</text>
</svg>
