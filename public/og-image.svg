<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B1B32"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="-60" r="220" fill="#00C9A7" fill-opacity="0.08"/>
  <circle cx="1150" cy="80" r="140" fill="#00C9A7" fill-opacity="0.06"/>
  <circle cx="80" cy="700" r="200" fill="#1e3a8a" fill-opacity="0.4"/>

  <!-- Cube mark (scaled, centered-left) -->
  <g transform="translate(120, 190)">
    <rect width="240" height="240" rx="52" fill="#0B1B32"/>
    <rect width="240" height="240" rx="52" fill="white" fill-opacity="0.05"/>
    <!-- Teal inner square rotated -->
    <rect x="43" y="43" width="115" height="115" rx="22" fill="#00C9A7" transform="rotate(12 100 100)"/>
    <!-- White outer stroke square rotated other way -->
    <rect x="82" y="82" width="115" height="115" rx="22" fill="none" stroke="white" stroke-width="12" opacity=".85" transform="rotate(-18 140 140)"/>
  </g>

  <!-- CUYPAY wordmark -->
  <text x="420" y="295" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="96" fill="white" letter-spacing="-2">CUY<tspan fill="#00C9A7">PAY</tspan></text>

  <!-- Divider -->
  <rect x="420" y="320" width="520" height="3" rx="2" fill="#00C9A7" fill-opacity="0.5"/>

  <!-- Tagline -->
  <text x="420" y="378" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="28" fill="white" fill-opacity="0.85">Transferencias internacionales al mejor precio</text>

  <!-- Pills -->
  <g transform="translate(420, 420)">
    <rect width="168" height="38" rx="19" fill="#00C9A7" fill-opacity="0.15" stroke="#00C9A7" stroke-opacity="0.4" stroke-width="1"/>
    <text x="84" y="24" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#00C9A7" text-anchor="middle" font-weight="600">Sin costo SWIFT</text>
    <rect x="184" width="140" height="38" rx="19" fill="#00C9A7" fill-opacity="0.15" stroke="#00C9A7" stroke-opacity="0.4" stroke-width="1"/>
    <text x="254" y="24" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#00C9A7" text-anchor="middle" font-weight="600">Mejor tasa</text>
    <rect x="340" width="178" height="38" rx="19" fill="#00C9A7" fill-opacity="0.15" stroke="#00C9A7" stroke-opacity="0.4" stroke-width="1"/>
    <text x="429" y="24" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#00C9A7" text-anchor="middle" font-weight="600">100% seguro</text>
  </g>

  <!-- Countries -->
  <text x="420" y="530" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="white" fill-opacity="0.45">🇨🇴 Colombia  ·  🇵🇪 Perú  ·  🇨🇱 Chile  ·  🇲🇽 México</text>

  <!-- Domain -->
  <text x="1150" y="600" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="white" fill-opacity="0.3" text-anchor="end" font-weight="500">www.cuypay.com</text>
</svg>
